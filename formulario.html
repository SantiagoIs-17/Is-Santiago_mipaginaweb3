<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfumes Elegance - Consulta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="img/logo.webp" alt="Logo Perfumes Elegance">
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="modelos.html">Fragancias</a></li>
            <li><a href="tecnologia.html">Ingredientes</a></li>
            <li><a href="electrico.html">Ecológicos</a></li>
            <li><a href="historia.html">Historia</a></li>
            <li><a href="formulario.html">Formulario</a></li>
        </ul>
    </nav>

    <div>
        <h1 class="centro">Registro y Asesoría Olfativa</h1>
        <p class="centro">Completa todos los campos para recibir muestras personalizadas o asesoría</p>

        <form action="#" method="POST" id="registroForm">
            <!-- Datos personales -->
            <fieldset>
                <legend>Datos del Cliente</legend>

                <div>
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Martín Gómez" required>
                </div>

                <div>
                    <label for="email">Correo electrónico *</label>
                    <input type="email" id="email" name="email" placeholder="Ej: martin@correo.com" required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 11 1234-5678">
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                </div>
            </fieldset>

            <!-- Preferencias Olfativas -->
            <fieldset>
                <legend>Preferencias Olfativas</legend>

                <div>
                    <label for="pais">Familia Olfativa Preferida *</label>
                    <select id="pais" name="categoria" required>
                        <option value="">Selecciona una opción...</option>
                        <option value="primera">Floral</option>
                        <option value="juveniles">Amaderada</option>
                        <option value="cadetes">Cítrica / Fresca</option>
                        <option value="menores">Oriental / Especiada</option>
                        <option value="infantiles">Gourmand / Dulce</option>
                        <option value="senior">Acuática</option>
                    </select>
                </div>

                <div>
                    <label>Concentración deseada</label>
                    <div>
                        <label>
                            <input type="radio" name="genero" value="arquero">
                            Eau de Cologne
                        </label>
                        <label>
                            <input type="radio" name="genero" value="extremo">
                            Eau de Toilette
                        </label>
                        <label>
                            <input type="radio" name="genero" value="armador">
                            Eau de Parfum
                        </label>
                        <label>
                            <input type="radio" name="genero" value="pivot" checked>
                            Parfum / Extracto
                        </label>
                    </div>
                </div>

                <div>
                    <label>Notas de interés</label>
                    <div>
                        <label>
                            <input type="checkbox" name="intereses" value="pelota">
                            Jazmín y Rosa
                        </label>
                        <label>
                            <input type="checkbox" name="intereses" value="resina">
                            Sándalo y Cedro
                        </label>
                        <label>
                            <input type="checkbox" name="intereses" value="rodilleras">
                            Vainilla y Ámbar
                        </label>
                        <label>
                            <input type="checkbox" name="intereses" value="botines">
                            Bergamota y Lima
                        </label>
                        <label>
                            <input type="checkbox" name="intereses" value="conjunto">
                            Lavanda y Romero
                        </label>
                    </div>
                </div>

                <div>
                    <label for="comentarios">Comentarios o solicitudes especiales</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Indica alguna alergia o tipo de empaque para regalo..."></textarea>
                </div>
            </fieldset>

            <!-- Contraseña -->
            <fieldset>
                <legend>Seguridad de la cuenta</legend>

                <div>
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div>
                    <label for="confirmPassword">Confirmar contraseña *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" minlength="8" required>
                </div>
            </fieldset>

            <!-- Términos y condiciones -->
            <div>
                <label>
                    <input type="checkbox" name="terminos" required>
                    Acepto los <a href="#">términos y condiciones</a> de Perfumes Elegance *
                </label>
            </div>

            <!-- Botones -->
            <div>
                <button type="submit">Enviar Solicitud</button>
                <button type="reset">Limpiar formulario</button>
            </div>
        </form>
    </div>

    <footer>
        <p>Página realizada por santiago is</p>
    </footer>

</body>
</html>
